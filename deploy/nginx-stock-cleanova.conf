# ============================================================================
# nginx: เปิด HTTPS ให้ cleanovaworld.com / stock.cleanovaworld.com
#
# ไฟล์นี้ "ไม่ได้ถูก include" โดย nginx — เป็นต้นฉบับให้คัดลอกไปแทน
# [SECTION: STOCK CLEANOVA] ใน C:\nginx-1.28.0\conf\nginx.conf
#
# ⚠️ nginx.conf ไฟล์เดียวเสิร์ฟทุกเว็บบนเครื่อง (rusuat, nineeagle, hk, agent, report, bigclean)
#    สำรองไฟล์ก่อนแก้ทุกครั้ง และรัน nginx -t ก่อน reload ทุกครั้ง config พัง = ล่มทุกเว็บ
#
# ⚠️ BigClean อยู่ใต้โดเมนเดียวกัน (/bigClean2026) และโค้ดที่ build แล้วเรียก
#    http://cleanovaworld.com/bigClean2026/api แบบตายตัว
#    ถ้าเปิด BigClean ผ่าน https เบราว์เซอร์จะบล็อกการเรียก API (mixed content) → BigClean พัง
#    จึงบังคับ https เฉพาะส่วน stock และให้ BigClean อยู่ http เหมือนเดิม
#    ด้วยเหตุผลเดียวกันจึง "ยังไม่ใส่ HSTS" — HSTS จะบังคับทั้งโดเมนรวม BigClean
#
# ขั้นตอน (รายละเอียดอยู่ใน docs/https-cleanovaworld.md):
#   ขั้น 1  ใส่ location acme-challenge (บล็อก PHASE 1) ใน server port 80 เดิม → -t → reload
#   ขั้น 2  sh deploy/le-cert.sh staging  แล้ว  issue
#   ขั้น 3  แทนทั้ง section ด้วยบล็อก PHASE 2 → -t → reload
#   ขั้น 4  ตั้ง Task Scheduler เรียก deploy/renew-cert.cmd
# ============================================================================


# ----------------------------------------------------------------------------
# PHASE 1 — เพิ่มใน server { listen 80; server_name cleanovaworld.com ... } เดิม
#           (วางต่อจากบรรทัด client_max_body_size) ไม่เปลี่ยนพฤติกรรมอื่นเลย
# ----------------------------------------------------------------------------
#
#        location ^~ /.well-known/acme-challenge/ {
#            root c:/stock_management/deploy/certbot/www;
#            default_type "text/plain";
#        }


# ----------------------------------------------------------------------------
# PHASE 2 — แทนทั้ง [SECTION: STOCK CLEANOVA] หลังได้ใบรับรองแล้ว
# ----------------------------------------------------------------------------

    # --- [SECTION: STOCK CLEANOVA] ---
    server {
        listen 80;
        server_name cleanovaworld.com stock.cleanovaworld.com;
        client_max_body_size 500M;
        # เพิ่มขนาดสูงสุดของ Body คำขอสำหรับเว็บไซต์นี้ (แก้ปัญหา 413 Request Entity Too Large)

        # ให้ Let's Encrypt ตรวจสิทธิ์ตอนต่ออายุ (ต้องอยู่บน port 80 เสมอ)
        location ^~ /.well-known/acme-challenge/ {
            root c:/stock_management/deploy/certbot/www;
            default_type "text/plain";
        }

        # ระบบ stock ย้ายไป https
        # ใช้ 302 ไม่ใช่ 301 ช่วงแรก: 301 เบราว์เซอร์จำถาวร ถ้าต้องถอยกลับ http จะถอยไม่ได้
        location = / { return 302 https://$host/stock; }
        location /stock { return 302 https://$host$request_uri; }

        # 1. BigClean Main API (คงเดิม — BigClean ยังอยู่ http)
        location ^~ /bigClean2026/api/ {
            proxy_pass http://bigclean_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Debug-Status "Sent-to-BigClean-8003";
        }

        # 2. BigClean Frontend (คงเดิม)
        location ^~ /bigClean2026/report {
            alias html/bigClean2026/report;
            index index.html;
            try_files $uri $uri/ /bigClean2026/report/index.html;
        }

        # 3. BigClean Static Files (คงเดิม)
        location /bigClean2026 {
            alias html/bigClean2026;
            index index.html;
            try_files $uri $uri/ /bigClean2026/index.html;
        }

        # คงไว้ให้ของเก่าที่ยังเรียกผ่าน http (เช่น bookmark ที่ชี้ /api ตรง)
        # หน้าเว็บ stock เองวิ่งผ่าน https หมดแล้วจาก redirect ด้านบน
        location /_next/ {
            proxy_pass http://stock_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://stock_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Test Path (สำหรับเช็คสุขภาพ Port 8003) — คงเดิม
        location /testapi {
            proxy_pass http://127.0.0.1:8003/;
            add_header X-Check "Nginx-to-8003-OK";
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name cleanovaworld.com stock.cleanovaworld.com;

        # ไฟล์ถูก "แบน" ออกมาจาก docker volume ด้วย deploy/le-cert.sh (ไม่ใช่ symlink)
        ssl_certificate     c:/stock_management/deploy/certbot/host/fullchain.pem;
        ssl_certificate_key c:/stock_management/deploy/certbot/host/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        # ไม่ประกาศ ssl_session_cache — zone "SSL" จองไว้แล้วที่ vhost nineeagle ประกาศซ้ำคนละขนาด -t จะไม่ผ่าน

        client_max_body_size 500M;
        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # ยังไม่ใส่ Strict-Transport-Security — ดูหมายเหตุ BigClean ด้านบน

        location = / { return 302 /stock; }

        # BigClean ใช้ https ไม่ได้ (API เขียน http:// ตายตัว) ส่งกลับไป http ที่ใช้งานได้
        location /bigClean2026 { return 302 http://$host$request_uri; }

        location = /stock {
            proxy_pass http://stock_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /_next/ {
            proxy_pass http://stock_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /stock {
            proxy_pass http://stock_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /api/ {
            proxy_pass http://stock_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
