version: '3.8'

services:
  postgres:
    # Use Amazon ECR Public mirror to avoid Docker Hub auth outages
    image: public.ecr.aws/docker/library/postgres:15-alpine
    container_name: stock_db
    environment:
      POSTGRES_USER: stockadmin
      POSTGRES_PASSWORD: stockpass123
      POSTGRES_DB: stock_management
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockadmin -d stock_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_api
    environment:
      DATABASE_URL: postgresql://stockadmin:stockpass123@host.docker.internal:5432/stock_management
      SECRET_KEY: 655a63a2fdd5170c7f5b0825b8f813e16a80ef154f80f999b67a1e16eee10500
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock_web
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_BASE_PATH: /stock
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
